server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: ms-campuslab-bff

  security:
    oauth2:
      resourceserver:
        jwt:
          # v2.0 endpoint (recomendado): valida iss = https://login.microsoftonline.com/{tenant-id}/v2.0
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:c75374e8-15d8-446b-8c6c-291120e0c761}/v2.0

          # Alternativa explícita al issuer-uri (Spring resuelve el JWK Set vía
          # OIDC discovery de todos modos; se deja documentado por si el
          # entorno no tiene salida a Internet y se requiere fijar la URL del JWKS).
          # jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:c75374e8-15d8-446b-8c6c-291120e0c761}/discovery/v2.0/keys

# Propiedades propias de la aplicación (no estándar de Spring),
# usadas por JwtDecoderConfig / JwtAuthenticationConverter.
campuslab:
  security:
    azure:
      tenant-id: ${AZURE_TENANT_ID:c75374e8-15d8-446b-8c6c-291120e0c761}
      # Client ID (Application ID) de la app registrada en Azure AD para este BFF.
      # El validador de audiencia exige que el claim "aud" del JWT coincida con este valor.
      audience: ${AZURE_CLIENT_ID:6bf386f7-c08e-4ab9-88cd-57f56b590e66}
    # Nombre del claim dentro del JWT donde Azure AD entrega los roles de la
    # aplicación (App Roles). Por defecto Azure AD usa "roles".
    roles-claim: roles

  # URLs base de los microservicios de dominio hacia los que este BFF enruta
  # (ver GatewayConfig). En docker-compose se sobreescriben con el nombre del
  # servicio en la red (ej. http://ms-campuslab-catalog:8081).
  services:
    catalog-base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    bookings-base-url: ${BOOKINGS_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
